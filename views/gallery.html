<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrau City - Contact</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">

</head>

<body class="flex flex-col bg-blue-100/20">

  <!-- Render shared navbar -->
  <div id="navbar-container" class="fixed top-10 left-1/2 transform -translate-x-1/2 h-17 w-[90%] z-20"> </div>
  <script src="/javascript/navbar.js"></script>

  <!-- Gallery Container -->
  <div data-controller="gallery" class="mx-auto mt-35 p-2">

    <!-- Appartement Selection -->
    <div class="flex justify-center">
      <ul class="flex gap-3 bg-gray-100 p-2 rounded-2xl shadow-sm">

        <!-- Active -->
        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="studio" class="px-5 py-2 rounded-xl bg-green-900 text-white font-medium text-sm cursor-pointer shadow transition">
          Studios
        </li>

        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="apt_two" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer
                  hover:bg-white hover:shadow transition">
          2-Bedroom Apartments
        </li>

        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="apt_three" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer
                  hover:bg-white hover:shadow transition">
          3-Bedroom Apartments
        </li>

        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="exterior" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer
                  hover:bg-white hover:shadow transition">
          Exterior & Amenities
        </li>

      </ul>
    </div>

    <!-- Gallery Display -->
    <div data-gallery-target="display" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-10">
    </div>

    <!-- Lightbox Display -->
    <div data-gallery-target="lightbox" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
      <button data-action="click->gallery#prev" class="absolute left-5 text-white text-4xl">‹</button>
      <img data-gallery-target="image" src="/img1.jpg" class="max-w-[90%] max-h-[80%]">
      <button data-action="click->gallery#next" class="absolute right-5 text-white text-4xl">›</button>
      <button data-action="click->gallery#close" class="absolute top-5 right-5 text-white text-2xl">✕</button>
    </div>

  </div>

  <!-- Footer container -->
  <div id="footer-container" class="w-full bg-green-900 backdrop-blur-sm py-12"> </div>

  <script src="/javascript/footer.js"></script>
  <script type="module" src="/javascript/controllers/gallery_controller.js"></script>

</body>

</html>
