<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the Atrau City gallery — interior and exterior renders of studios, 2-bedroom and 3-bedroom apartments in Atrau, Kazakhstan.">
  <title>Atrau City - Gallery</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <!-- Global styles -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

</head>

<body class="flex flex-col bg-blue-100/20">

  <!-- Render shared navbar -->
  <div id="navbar-container" class="fixed top-10 left-1/2 transform -translate-x-1/2 h-17 w-[90%] z-20"> </div>
  <script type="module" src="/javascript/controllers/navbar_controller.js"></script>
  <script src="/javascript/navbar.js"></script>

  <!-- Gallery Container -->
  <div data-controller="gallery" data-action="click@window->gallery#closeDropdown" class="w-full max-w-6xl mx-auto mt-35 mb-10 p-2">

      <div class="flex items-center mb-6">
        <!-- Vertical stripe -->
        <div class="w-1 h-12 bg-green-700 mr-4 rounded"></div>

        <!-- Heading -->
        <h2 class="text-5xl font-bold text-green-900">Gallery</h2>
      </div>

    <!-- Appartement Selection -->

    <!-- Mobile dropdown (hidden on md+) -->
    <div class="md:hidden mb-4 relative">
      <button data-gallery-target="dropdownBtn"
              data-action="click->gallery#toggleDropdown"
              class="w-full flex justify-between items-center px-5 py-3 bg-gray-100 rounded-2xl shadow-sm font-medium text-sm text-green-900 cursor-pointer">
        <span data-gallery-target="dropdownLabel">Studios</span>
        <i data-gallery-target="dropdownChevron" class="ti ti-chevron-down transition-transform duration-300"></i>
      </button>
      <div data-gallery-target="dropdown"
           class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-lg flex flex-col z-10 overflow-hidden">
        <button data-action="click->gallery#selection" data-type="studio"
                class="px-5 py-3 text-green-900 font-medium text-sm text-left hover:bg-green-50 transition">Studios</button>
        <button data-action="click->gallery#selection" data-type="apt_two"
                class="px-5 py-3 text-green-900 font-medium text-sm text-left hover:bg-green-50 transition">2-Bedroom Apartments</button>
        <button data-action="click->gallery#selection" data-type="apt_three"
                class="px-5 py-3 text-green-900 font-medium text-sm text-left hover:bg-green-50 transition">3-Bedroom Apartments</button>
        <button data-action="click->gallery#selection" data-type="exterior"
                class="px-5 py-3 text-green-900 font-medium text-sm text-left hover:bg-green-50 transition">Exterior & Amenities</button>
      </div>
    </div>

    <!-- Desktop pill bar (hidden on mobile) -->
    <div class="hidden md:flex justify-center">
      <ul class="flex gap-3 bg-gray-100 p-2 rounded-2xl shadow-sm">
        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="studio" class="px-5 py-2 rounded-xl bg-green-900 text-white font-medium text-sm cursor-pointer shadow transition">
          Studios
        </li>
        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="apt_two" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer hover:bg-white hover:shadow transition">
          2-Bedroom Apartments
        </li>
        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="apt_three" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer hover:bg-white hover:shadow transition">
          3-Bedroom Apartments
        </li>
        <li data-gallery-target="btn" data-action="click->gallery#selection" data-type="exterior" class="px-5 py-2 rounded-xl text-green-900 font-medium text-sm cursor-pointer hover:bg-white hover:shadow transition">
          Exterior & Amenities
        </li>
      </ul>
    </div>

    <!-- Gallery Display -->
    <div data-gallery-target="display" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-10">
    </div>

    <!-- CTA Section -->
    <div class="text-center py-12 mt-10 bg-green-900/10 rounded-2xl">
      <h2 class="text-3xl font-semibold text-green-900 mb-3">Like What You See?</h2>
      <p class="text-green-800 mb-6">Get in touch with our team for more information about available units.</p>
      <a href="/views/contact.html" class="bg-green-900 hover:bg-green-900/80 text-white px-8 py-3 rounded-xl font-semibold transition">
        Contact Us
      </a>
    </div>

    <!-- Lightbox Display -->
    <div data-gallery-target="lightbox" data-action="click->gallery#closeOnBackground" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
      <img data-gallery-target="image" src="/img1.jpg" class="max-w-[90%] max-h-[80vh]">
      <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex gap-4">
        <button data-action="click->gallery#prev" class="bg-white/50 hover:bg-white/70 text-white py-3 px-4 rounded-xl shadow transition">
          <i class="ti ti-chevron-left text-3xl"></i>
        </button>
        <button data-action="click->gallery#next" class="bg-white/50 hover:bg-white/70 text-white py-3 px-4 rounded-xl shadow transition">
          <i class="ti ti-chevron-right text-3xl"></i>
        </button>
      </div>
      <button data-action="click->gallery#close" class="absolute top-5 right-5 bg-white/50 hover:bg-white/70 text-white py-3 px-4 rounded-xl shadow transition">
        <i class="ti ti-x text-3xl"></i>
      </button>
    </div>

  </div>

  <!-- Footer container -->
  <div id="footer-container" class="w-full bg-green-900 backdrop-blur-sm py-12"> </div>

  <script src="/javascript/footer.js"></script>
  <script type="module" src="/javascript/controllers/gallery_controller.js"></script>

</body>

</html>
